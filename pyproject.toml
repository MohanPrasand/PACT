[project]
name = "pact"
version = "0.1.0"
description = "PACT — Policy and Authorization Control Tower: financial governance runtime for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "mcp>=1.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pact = "pact_server.cli:main"
pact-mcp = "pact_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pact_core", "pact_server", "pact_mcp", "merchant_lab", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
